<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>LLM Models: sign in</title>
<style>
:root{--lime:#c8f031;--lime-ink:#14170a;--bg:#f3f2ec;--card:#fffefa;--well:#f6f5ee;--ink:#15171a;--mut:#5a606b;--line:#dcdacf;--bad:#c0271b;--focus:#456000;--fill:#15171a;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0d0e11;--card:#15171c;--well:#0f1114;--ink:#eceef2;--mut:#9aa3b2;--line:#272b34;--bad:#ff7366;--focus:#c8f031;--fill:#c8f031}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:var(--bg)}
body{background:radial-gradient(700px 380px at 50% -60px,color-mix(in srgb,var(--lime) 16%,transparent),transparent 70%),var(--bg);background-repeat:no-repeat}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 26px 24px;box-shadow:0 24px 60px -30px rgba(0,0,0,.45)}
.mark{width:44px;height:44px;border-radius:12px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;margin-bottom:18px}
.mark svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:26px;line-height:1.1;letter-spacing:-.03em;margin:0 0 6px;font-weight:750}
p{margin:0 0 20px;color:var(--mut);font-size:14px}
.deco{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:0 0 22px}
.deco i{display:block;height:100%;width:62%;border-radius:99px;background:var(--fill)}
label{display:block;font:500 11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:6px}
input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:var(--well);color:var(--ink);font:inherit}
input:focus-visible{outline-offset:0;border-color:var(--focus)}
button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:11px;background:var(--lime);color:var(--lime-ink);font:inherit;font-weight:700;cursor:pointer}
button:hover{filter:brightness(.95)}
button:disabled{opacity:.6;cursor:default}
.err{color:var(--bad);font-size:13.5px;min-height:20px;margin-top:12px}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5.5 20h13"/></svg></div>
  <h1>LLM Models</h1>
  <p>Sign in to manage model downloads.</p>
  <div class="deco" aria-hidden="true"><i></i></div>
  <label for="pw">Password</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
  <button id="go" type="submit">Sign in</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const b = document.getElementById('go'), err = document.getElementById('err');
  b.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: document.getElementById('pw').value})});
    const j = await r.json().catch(() => ({}));
    if (r.ok) { location.href = '/'; return; }
    err.textContent = j.error || 'Sign-in failed.';
  } catch (x) { err.textContent = 'Could not reach the server.'; }
  b.disabled = false;
});
</script>
</body>
</html>
